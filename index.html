<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이스터 섬의 턱</title>
  <!-- 한글 도트(픽셀) 폰트: 불러오지 못하면 style.css의 대체 폰트가 사용됩니다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 전체를 채우는 게임 캔버스 (크기는 script.js에서 창 크기에 맞춤) -->
  <canvas id="gameCanvas"></canvas>

  <!-- 상단 HUD: 조작 안내 + 보유 골드 -->
  <div class="hud">
    <div>이동: 방향키 / WASD &nbsp;|&nbsp; 상호작용: E</div>
    <div class="gold">보유 골드: <span id="goldText">0</span> G</div>
  </div>

  <!-- 로컬 스토리지 초기화 버튼 -->
  <button id="resetBtn" class="reset-btn" type="button">데이터 초기화</button>

  <!-- 상호작용 결과 메시지 -->
  <div id="message" class="message"></div>

  <!-- 하단 대화창 (Dialogue UI) -->
  <div id="dialogue" class="dialogue hidden">
    <div id="dlgName" class="dlg-name"></div>
    <p id="dlgText" class="dlg-text"></p>
    <span id="dlgNext" class="dlg-next">▼</span>
    <div class="dlg-hint">클릭 또는 Enter</div>
  </div>

  <!-- 턱 깎기 미니게임 모달 -->
  <div id="carveModal" class="modal hidden">
    <div id="carvePanel" class="carve-panel">
      <button id="carveClose" class="carve-close" type="button" title="닫기 (Esc)">✕</button>

      <!-- 상단: V라인 완성도 게이지 -->
      <div class="gauge-head">
        <span>V라인 완성도</span>
        <span id="gaugeText">0%</span>
      </div>
      <div class="gauge">
        <div id="gaugeFill" class="gauge-fill"></div>
      </div>

      <!-- 중앙: 확대된 모아이 석상 (노란 점선 부분이 클릭할 턱) -->
      <div id="carveStage" class="carve-stage">
        <svg id="carveSvg" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
          <!-- 몸통 -->
          <polygon points="70,150 170,150 205,295 35,295" fill="#6f6f6f" stroke="#333" stroke-width="4"/>
          <!-- 머리 -->
          <rect x="45" y="20" width="150" height="130" fill="#8d8d8d" stroke="#333" stroke-width="4"/>
          <!-- 눈썹 그늘 / 코 / 입 -->
          <rect x="45" y="50" width="150" height="14" fill="#5f5f5f"/>
          <rect x="112" y="62" width="16" height="48" fill="#757575"/>
          <rect x="98" y="122" width="44" height="7" fill="#4a4a4a"/>
          <!-- 턱 (클릭 대상) : 모양은 script.js에서 게이지에 따라 뾰족하게 변함 -->
          <polygon id="chinShape" class="chin" points="64,138 176,138 172,205 68,205"
                   fill="#a3a3a3" stroke="#ffd54a" stroke-width="4" stroke-dasharray="8 5"/>
        </svg>
        <div id="carveDone" class="carve-done hidden">완벽한 V라인 완성!</div>
      </div>

      <!-- 하단: 안내 문구 + 망치질 버튼 -->
      <p class="carve-guide">마우스로 턱을 클릭해 날렵하게 깎으세요!</p>
      <button id="carveBtn" class="carve-btn" type="button">🔨 턱 깎기 (망치질)</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
