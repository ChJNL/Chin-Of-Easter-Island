<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이스터 섬의 턱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1>🗿 이스터 섬의 턱</h1>
      <div class="stats">
        <span class="stat" id="stat-gold">💰 0 G</span>
        <span class="stat" id="stat-tools">🧰 도구 없음</span>
        <span class="stat hidden" id="stat-buff">📣 전단지</span>
        <span class="stat" id="stat-map">📍 원주민 마을</span>
      </div>
      <div class="hud-buttons">
        <button id="btn-save" type="button">💾 저장</button>
        <button id="btn-reset" type="button" class="danger">🗑 초기화</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="800" height="480"></canvas>
      <div id="toast" class="toast hidden" role="status"></div>
    </main>

    <!-- 모바일 / 터치 조작부 -->
    <section id="controls" aria-label="터치 조작">
      <div class="dpad">
        <button type="button" class="dp up" data-dir="up" aria-label="위">▲</button>
        <button type="button" class="dp left" data-dir="left" aria-label="왼쪽">◀</button>
        <button type="button" class="dp right" data-dir="right" aria-label="오른쪽">▶</button>
        <button type="button" class="dp down" data-dir="down" aria-label="아래">▼</button>
      </div>
      <button type="button" id="btn-interact" aria-label="상호작용">E<small>상호작용</small></button>
    </section>

    <p id="help">
      이동: <b>WASD / 방향키</b> · 상호작용: <b>E</b> · 모바일: 방향 버튼 + <b>E</b> 버튼 (건물/석상을 직접 탭해도 됩니다)
    </p>
  </div>

  <!-- 공용 모달 (상점 / 홍보판 / 부동산 / 턱 깎기 / 대화 / 스토리) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button type="button" id="modal-close" class="modal-x" aria-label="닫기">✕</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <p id="modal-msg" class="modal-msg" aria-live="polite"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
