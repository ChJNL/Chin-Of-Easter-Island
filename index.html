<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이스터 섬의 턱</title>
  <!-- 한글 도트(픽셀) 폰트: 불러오지 못하면 style.css의 대체 폰트가 사용됩니다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 전체를 채우는 게임 캔버스 (크기는 script.js에서 창 크기에 맞춤) -->
  <canvas id="gameCanvas"></canvas>

  <!-- 상단 조작 안내 -->
  <div class="hud">이동: 방향키 / WASD &nbsp;|&nbsp; 상호작용: E</div>

  <!-- 로컬 스토리지 초기화 버튼 -->
  <button id="resetBtn" class="reset-btn" type="button">데이터 초기화</button>

  <!-- 상호작용 결과 메시지 -->
  <div id="message" class="message"></div>

  <!-- 하단 대화창 (Dialogue UI) -->
  <div id="dialogue" class="dialogue hidden">
    <div id="dlgName" class="dlg-name"></div>
    <p id="dlgText" class="dlg-text"></p>
    <span id="dlgNext" class="dlg-next">▼</span>
    <div class="dlg-hint">클릭 또는 Enter</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
